<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart – ElectroMart</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body data-page="cart">
  <main class="container">
    <header class="page-header">
      <h1 class="page-title">Shopping cart</h1>
      <p class="page-subtitle">Review products in your cart, update quantities or apply coupon.</p>
    </header>

    <section class="cart-layout">
      <div class="card">
        <div data-cart-empty class="muted" style="margin-bottom:0.5rem; display:none;">
          Your cart is empty. Add products from the products page.
        </div>
        <div data-cart-list></div>
      </div>
      <aside class="card">
        <h2 class="section-title" style="font-size:1.05rem; margin-bottom:0.6rem;">Order summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span data-summary-subtotal>₹0</span>
        </div>
        <div class="summary-row">
          <span>Discount</span>
          <span data-summary-discount>₹0</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span data-summary-total>₹0</span>
        </div>
        <div class="coupon-row">
          <input type="text" class="input" placeholder="Enter coupon (SAVE20 / WELCOME10)" data-coupon-input>
          <button class="btn btn-secondary" type="button" data-apply-coupon>Apply</button>
        </div>
        <p class="muted">Available coupons: <span class="pill">SAVE20</span> <span class="pill">WELCOME10</span></p>
        <div style="margin-top:1rem;">
          <a href="checkout.html" class="btn btn-primary" style="width:100%; text-align:center;">Proceed to checkout</a>
        </div>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
