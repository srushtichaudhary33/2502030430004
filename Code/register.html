<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ElectroMart</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body data-page="register">
  <header class="site-header">
    <div class="header-strip">
      <div class="container header-strip-inner">
        <span>Deliver to <strong>India</strong></span>
        <div class="header-strip-links">
          <a href="contact.html">Help</a>
          <a href="index.html">Home</a>
        </div>
      </div>
    </div>
    <div class="header-main">
      <div class="container header-main-inner">
        <a href="index.html" class="brand-header">
          <span class="brand-logo" aria-hidden="true"></span>
          <span class="brand-text">Electro<span class="brand-accent">Mart</span></span>
        </a>
        <form class="header-search" action="products.html" method="get" role="search">
          <input type="search" name="q" class="header-search-input" placeholder="Search products…" autocomplete="off" aria-label="Search">
          <button type="submit" class="header-search-btn">Search</button>
        </form>
        <div class="header-actions">
          <a href="login.html" class="header-account">
            <span class="header-account-line1">Already user?</span>
            <span class="header-account-line2">Login</span>
          </a>
          <a href="cart.html" class="header-cart" aria-label="Cart">
            <span class="header-cart-icon" aria-hidden="true">🛒</span>
            <span class="header-cart-count" data-cart-count>0</span>
          </a>
          <button type="button" class="header-theme theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
            <span aria-hidden="true">🌙</span>
          </button>
        </div>
      </div>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create account</h1>
        <p>Register as a new user to start shopping.</p>
      </div>
      <form data-register-form>
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" class="input" placeholder="Your full name">
        </div>
        <div class="form-group" style="margin-top:0.7rem;">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" class="input" placeholder="you@example.com">
        </div>
        <div class="form-group" style="margin-top:0.7rem;">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="text" class="input" placeholder="10 digit mobile number">
        </div>
        <div class="form-group" style="margin-top:0.7rem;">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" class="input" placeholder="Create password">
        </div>
        <div class="form-group" style="margin-top:0.7rem;">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" class="input" placeholder="Re‑enter password">
        </div>
        <div data-auth-alert class="alert" style="margin-top:0.8rem; display:none;"></div>
        <div style="margin-top:1rem;">
          <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
        </div>
      </form>
      <p class="muted" style="margin-top:0.8rem;">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
      <div style="margin-top:1rem;">
        <a href="index.html" class="btn btn-secondary" style="width:100%; text-align:center;">← Back to Home</a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
